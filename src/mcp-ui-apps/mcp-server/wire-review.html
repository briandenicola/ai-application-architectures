<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wire review</title>
  <style>
    :root { --ink:#1e1e1e; --muted:#6b7280; --line:#e5e7eb; --accent:#087f5b; --accent-bg:#e6fcf5; --red:#c92a2a; --btn:#1971c2; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 "Segoe UI", Inter, system-ui, sans-serif; color:var(--ink); background:#fff; }
    .panel { border:1.5px solid var(--accent); border-radius:10px; overflow:hidden; }
    header { background:var(--accent-bg); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
    header h1 { margin:0; font-size:15px; color:var(--accent); }
    header span { color:var(--muted); font-size:12px; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 14px; border-bottom:1px solid var(--line); }
    td { padding:9px 14px; border-bottom:1px solid var(--line); }
    tr.wire { cursor:pointer; }
    tr.wire:hover td { background:#f8fafc; }
    tr.wire.selected td { background:#fff5f5; }
    .risk { font-weight:700; color:var(--red); }
    .mono { font-family:Consolas, Menlo, monospace; }
    .detail { padding:12px 14px; display:none; }
    .detail.open { display:block; }
    .signals { margin:6px 0 12px; padding-left:18px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--btn); background:#e7f5ff; color:var(--btn); cursor:pointer; }
    button.primary { background:var(--btn); color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    .status { margin-top:10px; font-size:13px; }
    .status.ok { color:#2b8a3e; }
    .status.err { color:var(--red); }
    .empty { padding:18px 14px; color:var(--muted); }
  </style>
</head>
<body>
  <div class="panel">
    <header><h1>High-risk wires</h1><span id="meta">waiting for tool result…</span></header>
    <table>
      <thead><tr><th>Wire</th><th>Customer</th><th>Amount</th><th>Risk</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="detail" class="detail">
      <strong id="detail-title"></strong>
      <ul id="signals" class="signals"></ul>
      <div class="actions">
        <button id="hold" class="primary">Create hold request</button>
        <button id="ask">Ask the agent about this wire</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>
  <script type="module" src="/src/wire-review.ts"></script>
</body>
</html>
