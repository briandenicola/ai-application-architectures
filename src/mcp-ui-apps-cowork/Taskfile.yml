# https://taskfile.dev
#
#   task setup     install Node + Python deps (once)
#   task up:fake   run everything with the scripted local LLM (no Azure needed)
#   task up        run everything against Foundry / Azure OpenAI (agent/.env)
#   task verify    smoke-test every hop from the CLI (in a second terminal)
#
# `task up*` runs the services in the foreground. Ctrl+C stops all of them.
# Commands use Task's built-in POSIX shell, so they also work on Windows
# (Task >= 3.43 for the built-in cp/rm).
version: "3"

vars:
  MCP_PORT: 3001
  AGENT_PORT: 8888
  FAKE_LLM_PORT: 8889
  HOST_PORT: 3000
  PY: '{{if eq OS "windows"}}.venv/Scripts/python.exe{{else}}.venv/bin/python{{end}}'
  PYTHON: '{{if eq OS "windows"}}python{{else}}python3{{end}}'

env:
  MCP_URL: "http://localhost:{{.MCP_PORT}}/mcp"
  AGENT_URL: "http://localhost:{{.AGENT_PORT}}/"
  FAKE_LLM_URL: "http://localhost:{{.FAKE_LLM_PORT}}/v1"

tasks:
  default:
    cmds: [task --list]
    silent: true

  # ---------- setup ----------
  setup:
    desc: Install all dependencies (npm + Python venv)
    deps: [setup:mcp, setup:host, setup:agent]

  setup:mcp:
    dir: mcp-server
    cmds: [npm install --no-audit --no-fund]
    sources: [package.json]
    generates: [node_modules/.package-lock.json]

  setup:host:
    dir: host
    cmds: [npm install --no-audit --no-fund]
    sources: [package.json]
    generates: [node_modules/.package-lock.json]

  setup:agent:
    dir: agent
    cmds:
      - '{{.PYTHON}} -m venv .venv'
      - '{{.PY}} -m pip install -q --upgrade pip'
      - '{{.PY}} -m pip install -q -r requirements.txt'
      - '[ -f .env ] || cp .env.example .env'
    sources: [requirements.txt]
    generates: ['{{.PY}}']

  # ---------- build ----------
  build:
    desc: Build the MCP App view (single-file HTML) and the host's browser bundle
    deps: [build:ui, build:host]

  build:ui:
    dir: mcp-server
    cmds: [npx vite build]
    sources: [wire-review.html, src/**/*.ts, vite.config.ts]
    generates: [dist/wire-review.html]

  build:host:
    dir: host
    cmds: [npm run build]
    sources: [src/**/*.ts]
    generates: [public/host.js]

  # ---------- run ----------
  up:
    desc: Run MCP server + MAF agent + host (LLM from agent/.env)
    cmds:
      - task: setup
      - task: build
      - task: _banner
      - task: _run
        vars: { WITH_FAKE: "false" }

  up:fake:
    desc: Same as `up`, but with the scripted local LLM (no cloud credentials)
    cmds:
      - task: setup
      - task: build
      - task: _banner
      - task: _run
        vars: { WITH_FAKE: "true", LLM_MODE: "fake" }

  _run:
    internal: true
    deps:
      - task: run:mcp
      - task: run:agent
        vars: { LLM_MODE: "{{.LLM_MODE}}" }
      - task: run:host
      - task: '{{if eq .WITH_FAKE "true"}}run:fake-llm{{else}}_noop{{end}}'

  _noop:
    internal: true
    cmds: []

  _banner:
    internal: true
    silent: true
    cmds:
      - echo ""
      - echo "  Host UI ....... http://localhost:{{.HOST_PORT}}"
      - echo "  MAF AG-UI ..... http://localhost:{{.AGENT_PORT}}/"
      - echo "  MCP server .... http://localhost:{{.MCP_PORT}}/mcp"
      - echo "  Ctrl+C stops everything. Run 'task verify' in another terminal."
      - echo ""

  run:mcp:
    desc: Run only the banking MCP server
    dir: mcp-server
    env: { PORT: "{{.MCP_PORT}}" }
    cmds: [npx tsx main.ts]

  run:agent:
    desc: Run only the MAF AG-UI agent
    dir: agent
    env:
      AGENT_PORT: "{{.AGENT_PORT}}"
      LLM_MODE: '{{.LLM_MODE | default ""}}'  # empty → agent/.env decides
    cmds: ['{{.PY}} main.py']

  run:fake-llm:
    desc: Run only the scripted local LLM
    dir: agent
    env: { FAKE_LLM_PORT: "{{.FAKE_LLM_PORT}}" }
    cmds: ['{{.PY}} fake_llm.py']

  run:host:
    desc: Run only the host BFF + browser page
    dir: host
    env: { HOST_PORT: "{{.HOST_PORT}}" }
    cmds: [npx tsx server.ts]

  # ---------- check ----------
  verify:
    desc: Smoke-test every hop through the running host (no browser)
    cmds: ['node scripts/verify.mjs http://localhost:{{.HOST_PORT}}']

  typecheck:
    desc: TypeScript checks for mcp-server and host
    cmds:
      - cmd: npx tsc -p mcp-server
      - cmd: npx tsc -p host

  # ---------- Azure Foundry infrastructure ----------
  infra:validate:
    desc: Initialize Terraform, check formatting, and validate Foundry configuration
    cmds:
      - terraform -chdir=infra init -input=false
      - terraform -chdir=infra fmt -check
      - terraform -chdir=infra validate

  infra:plan:
    desc: Preview Foundry infrastructure in the active Azure CLI subscription
    vars:
      SUBSCRIPTION_ID:
        sh: az account show --query id --output tsv
      DEVELOPER_OBJECT_ID:
        sh: az ad signed-in-user show --query id --output tsv
    env:
      TF_VAR_subscription_id: "{{.SUBSCRIPTION_ID}}"
      TF_VAR_developer_object_id: "{{.DEVELOPER_OBJECT_ID}}"
    cmds:
      - task: infra:validate
      - terraform -chdir=infra plan

  infra:up:
    desc: Provision Foundry and Cowork Functions (confirmation required), then configure the local agent
    interactive: true
    vars:
      SUBSCRIPTION_ID:
        sh: az account show --query id --output tsv
      DEVELOPER_OBJECT_ID:
        sh: az ad signed-in-user show --query id --output tsv
    env:
      TF_VAR_subscription_id: "{{.SUBSCRIPTION_ID}}"
      TF_VAR_developer_object_id: "{{.DEVELOPER_OBJECT_ID}}"
    cmds:
      - task: infra:validate
      - terraform -chdir=infra apply
      - task: infra:configure

  infra:configure:
    desc: Configure agent/.env for Entra ID using existing Terraform outputs
    cmds:
      - task: setup:agent
      - 'agent/{{.PY}} scripts/configure_foundry.py'

  infra:test:
    desc: Test agent authentication and Terraform-to-agent configuration updates
    cmds:
      - task: setup:agent
      - 'agent/{{.PY}} -m unittest discover -s scripts -p "test_*.py"'

  # ---------- Microsoft Copilot Cowork ----------
  cowork:setup:
    desc: Install the pinned Microsoft 365 Agents Toolkit for plugin registration and installation
    dir: cowork
    cmds: [npm ci --no-audit --no-fund]
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]

  cowork:check:
    desc: Offline Function tests, type checks, packaging tests, and Terraform validation
    cmds:
      - task: setup:mcp
      - task: cowork:setup
      - npm --prefix mcp-server test
      - npx --prefix mcp-server tsc -p mcp-server
      - '{{.PYTHON}} -m unittest discover -s scripts -p test_cowork.py'
      - task: infra:validate

  cowork:build:
    desc: Build the shared MCP App and package both Azure Functions (no Azure changes)
    cmds:
      - task: setup:mcp
      - task: build:ui
      - '{{.PYTHON}} scripts/cowork.py build'

  cowork:tamper:
    desc: Disable each new authority/persistence/response guard, require test failure, and restore
    cmds: ['{{.PYTHON}} scripts/tamper_cowork.py']

  cowork:deploy:
    desc: Register the Foundry prompt agent and deploy both Functions into provisioned infrastructure
    cmds:
      - task: cowork:build
      - '{{.PYTHON}} scripts/cowork.py agent'
      - '{{.PYTHON}} scripts/cowork.py deploy'
      - '{{.PYTHON}} scripts/cowork.py configure'

  cowork:login:
    desc: Sign in to the Microsoft 365 tenant used for Cowork
    dir: cowork
    cmds:
      - task: cowork:setup
      - npx atk auth login m365

  cowork:register:
    desc: Register secretless OAuth/PKCE in Microsoft's token store using Terraform-created app registrations
    cmds:
      - task: cowork:setup
      - '{{.PYTHON}} scripts/cowork.py configure'
      - cmd: npx atk provision --env local
        dir: cowork

  cowork:package:
    desc: Create the Microsoft Copilot Cowork plugin ZIP from Terraform and OAuth registration outputs
    cmds:
      - task: cowork:setup
      - '{{.PYTHON}} scripts/cowork.py package'

  cowork:install:
    desc: Package and personally install the banking Cowork plugin in Microsoft 365
    cmds:
      - task: cowork:package
      - cmd: npx atk install --file-path ../.build/banking-cowork.zip --scope Personal
        dir: cowork

  cowork:up:
    desc: Provision, deploy, register OAuth, and personally install the Microsoft Cowork demo
    interactive: true
    cmds:
      - task: infra:up
      - task: cowork:deploy
      - task: cowork:login
      - task: cowork:register
      - task: cowork:install

  cowork:verify:
    desc: Read-only deployed MCP smoke test (no hold submissions or model calls)
    cmds: ['{{.PYTHON}} scripts/cowork.py verify']

  clean:
    desc: Remove build output, node_modules and the Python venv
    cmds:
      - rm -rf mcp-server/dist mcp-server/node_modules host/node_modules host/public/host.js agent/.venv
