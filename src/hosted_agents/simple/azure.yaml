# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'

name: foundry-langgraph-demo

services:
  ai-project:
    host: azure.ai.project
    # To reuse an existing project instead of provisioning one, uncomment:
    # endpoint: https://<resource>.services.ai.azure.com/api/projects/<project>
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
      # Foundry Memory needs an embedding model
      - name: text-embedding-3-large
        model:
          format: OpenAI
          name: text-embedding-3-large
          version: '1'
        sku:
          name: GlobalStandard
          capacity: 10

  # Toolbox = one MCP endpoint the agent discovers tools from at runtime
  demo-tools:
    host: azure.ai.toolbox
    uses:
      - ai-project
    description: Bing-grounded web search + SharePoint (Work IQ MCP, runs as the calling user)
    tools:
      - type: web_search
        name: web_search
      - type: mcp
        server_label: sharepoint
        connection: sharepoint-conn          # created with `azd ai connection create` (see README)
        server_url: https://agent365.svc.cloud.microsoft/agents/servers/mcp_SharePointRemoteServer

  demo-agent:
    host: azure.ai.agent
    project: src/demo-agent
    language: docker                         # build from src/demo-agent/Dockerfile
    kind: hosted
    name: foundry-langgraph-demo
    displayName: LangGraph + Toolbox + Memory demo
    uses:
      - ai-project
      - demo-tools
    toolboxes:
      - demo-tools
    protocols:
      - protocol: responses
        version: 2.0.0                       # 2.0.0 = per-user identity headers + call-id forwarding
    startupCommand: python -m langchain_azure_ai.agents.hosting.run --protocol responses
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-5.4-mini
      TOOLBOX_NAME: demo-tools
      MEMORY_STORE_NAME: demo-memory
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi

infra:
  provider: microsoft.foundry
