version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: "/src/evals"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      azure-sdk:
        patterns:
          - "azure-*"
      dev-tooling:
        patterns:
          - "ruff"
          - "pyright"
          - "pytest*"

  - package-ecosystem: terraform
    directory: "/infrastructure"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
